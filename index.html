<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mind Map To-Do</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A24">
<link rel="icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To-Do Map">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&family=Poppins:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root, html[data-theme="chalkboard"]{
    --bg-canvas:#1E2A24; --bg-node:#26332C; --bg-node-hover:#2D3C33; --ink:#EDEAE0; --ink-dim:#A8B0A9;
    --chalk-yellow:#E8C468; --chalk-pink:#E9A0B5; --chalk-blue:#86B8D9; --line-muted:#4A564E;
    --ctrl-green:#8FBF9F; --ctrl-green-dark:#1F3D28; --ctrl-yellow:#E8C468; --ctrl-yellow-dark:#4A3510;
    --ctrl-blue:#86B8D9; --ctrl-blue-dark:#1C3547; --ctrl-bg-on:#EDE3C8;
    --act-orange:#E8A868; --act-orange-dark:#4A3110; --act-purple:#C79EE8; --act-purple-dark:#33204A;
    --act-red:#E97E7E; --act-red-dark:#4A1C1C; --act-green:#8FD9A0; --act-green-dark:#1F4A2C; --dot-rgb:237,234,224;
  }
  html[data-theme="midnight"]{
    --bg-canvas:#161B2E; --bg-node:#1F2740; --bg-node-hover:#28324F; --ink:#E6E8F5; --ink-dim:#9AA1C4;
    --chalk-yellow:#E8C468; --chalk-pink:#E39FD6; --chalk-blue:#8FA9F0; --line-muted:#3A4266;
    --ctrl-green:#8FE0C4; --ctrl-green-dark:#123D33; --ctrl-yellow:#E8C468; --ctrl-yellow-dark:#4A3510;
    --ctrl-blue:#8FA9F0; --ctrl-blue-dark:#1E2E5C; --ctrl-bg-on:#E3E6F8;
    --act-orange:#F0A868; --act-orange-dark:#4A3010; --act-purple:#B79AF0; --act-purple-dark:#2E1F4F;
    --act-red:#F08181; --act-red-dark:#4A1A1A; --act-green:#8FE0B0; --act-green-dark:#12402C; --dot-rgb:230,232,245;
  }
  html[data-theme="espresso"]{
    --bg-canvas:#241B15; --bg-node:#332619; --bg-node-hover:#3F2F1F; --ink:#F0E6D8; --ink-dim:#BFA98F;
    --chalk-yellow:#E8B860; --chalk-pink:#E9A88A; --chalk-blue:#9DBFCB; --line-muted:#5A4531;
    --ctrl-green:#A8C48A; --ctrl-green-dark:#2C3D1E; --ctrl-yellow:#E8B860; --ctrl-yellow-dark:#4A3510;
    --ctrl-blue:#9DBFCB; --ctrl-blue-dark:#233A42; --ctrl-bg-on:#F0E3C8;
    --act-orange:#EA9A50; --act-orange-dark:#4A2E0D; --act-purple:#C9A0D8; --act-purple-dark:#3A2445;
    --act-red:#E28572; --act-red-dark:#4A2018; --act-green:#A8D48A; --act-green-dark:#2C4A1E; --dot-rgb:240,230,216;
  }
  html[data-theme="obsidian"]{
    --bg-canvas:#1C1D22; --bg-node:#26272E; --bg-node-hover:#2F3038; --ink:#E9E9EE; --ink-dim:#9C9DA8;
    --chalk-yellow:#E0C87A; --chalk-pink:#D69AE0; --chalk-blue:#9AA8E0; --line-muted:#464752;
    --ctrl-green:#8FBFB0; --ctrl-green-dark:#1F3D34; --ctrl-yellow:#E0C87A; --ctrl-yellow-dark:#453A12;
    --ctrl-blue:#9AA8E0; --ctrl-blue-dark:#242C52; --ctrl-bg-on:#E6E4F0;
    --act-orange:#E0A468; --act-orange-dark:#452F10; --act-purple:#B49AE0; --act-purple-dark:#2E2245;
    --act-red:#DD8484; --act-red-dark:#451D1D; --act-green:#8FCFAE; --act-green-dark:#1F452F; --dot-rgb:233,233,238;
  }
  html[data-theme="nebula"]{
    --bg-canvas:#1E1530; --bg-node:#2A1E42; --bg-node-hover:#35284F; --ink:#F0E6FA; --ink-dim:#B39AC9;
    --chalk-yellow:#EBC978; --chalk-pink:#F09AD0; --chalk-blue:#A99AF0; --line-muted:#4E3A6E;
    --ctrl-green:#9AE0C0; --ctrl-green-dark:#173D2C; --ctrl-yellow:#EBC978; --ctrl-yellow-dark:#4A3712;
    --ctrl-blue:#A99AF0; --ctrl-blue-dark:#2A215C; --ctrl-bg-on:#F0E6FA;
    --act-orange:#F0A868; --act-orange-dark:#4A3010; --act-purple:#CB9EF5; --act-purple-dark:#3A2350;
    --act-red:#F08AAE; --act-red-dark:#4A1E2E; --act-green:#9AE8C0; --act-green-dark:#17402C; --dot-rgb:240,230,250;
  }
  html[data-theme="terminal"]{
    --bg-canvas:#0D120E; --bg-node:#141C16; --bg-node-hover:#1B2620; --ink:#D8ECD9; --ink-dim:#7FA080;
    --chalk-yellow:#E0C468; --chalk-pink:#E08A6A; --chalk-blue:#6ED6A0; --line-muted:#31402F;
    --ctrl-green:#6ED6A0; --ctrl-green-dark:#123D24; --ctrl-yellow:#E0C468; --ctrl-yellow-dark:#453510;
    --ctrl-blue:#6ED6A0; --ctrl-blue-dark:#143D28; --ctrl-bg-on:#DCEEDD;
    --act-orange:#E0A050; --act-orange-dark:#452C0D; --act-purple:#A0D6A8; --act-purple-dark:#1F3D24;
    --act-red:#E0806A; --act-red-dark:#451F14; --act-green:#7EE0A0; --act-green-dark:#144A28; --dot-rgb:216,236,217;
  }
  html[data-theme="parchment"]{
    --bg-canvas:#EDE3CD; --bg-node:#F6EFDF; --bg-node-hover:#FCF7EB; --ink:#3A2E1F; --ink-dim:#7A6A50;
    --chalk-yellow:#9C6F1C; --chalk-pink:#A8546A; --chalk-blue:#2E6482; --line-muted:#C4B28C;
    --ctrl-green:#3F7A4A; --ctrl-green-dark:#1F5A2C; --ctrl-yellow:#9C6F1C; --ctrl-yellow-dark:#6B4C10;
    --ctrl-blue:#2E6482; --ctrl-blue-dark:#1C4560; --ctrl-bg-on:#FFFFFF;
    --act-orange:#B5691E; --act-orange-dark:#7A4712; --act-purple:#7C56B0; --act-purple-dark:#4F3676;
    --act-red:#B03E3E; --act-red-dark:#7A2A2A; --act-green:#3F8A4A; --act-green-dark:#245A2C; --dot-rgb:58,46,31;
  }
  html[data-theme="daylight"]{
    --bg-canvas:#F0F2F5; --bg-node:#FFFFFF; --bg-node-hover:#F7F9FB; --ink:#242A32; --ink-dim:#69707C;
    --chalk-yellow:#B08423; --chalk-pink:#C05C7A; --chalk-blue:#2F6FA8; --line-muted:#D2D7DE;
    --ctrl-green:#2E8659; --ctrl-green-dark:#1C5A3A; --ctrl-yellow:#B08423; --ctrl-yellow-dark:#7A5A18;
    --ctrl-blue:#2F6FA8; --ctrl-blue-dark:#1D4A70; --ctrl-bg-on:#FFFFFF;
    --act-orange:#C06A1E; --act-orange-dark:#8A4A12; --act-purple:#7454B5; --act-purple-dark:#4C3878;
    --act-red:#C03E3E; --act-red-dark:#822A2A; --act-green:#2E9659; --act-green-dark:#1C5A3A; --dot-rgb:36,42,50;
  }
  :root{ --body-font:'Patrick Hand',cursive; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg-canvas);font-family:var(--body-font);color:var(--ink);overflow:hidden;transition:background .2s ease, color .2s ease;}
  body{
    background-image:
      radial-gradient(rgba(var(--dot-rgb),0.035) 1px, transparent 1px),
      radial-gradient(rgba(var(--dot-rgb),0.025) 1px, transparent 1px);
    background-size: 26px 26px, 26px 26px;
    background-position: 0 0, 13px 13px;
  }
  .app{display:flex;flex-direction:column;height:100vh;}
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:14px 22px 10px 26px;flex-shrink:0;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{font-family:'Space Mono',monospace;font-size:13px;color:var(--chalk-blue);letter-spacing:2px;}
  .title-edit{
    font-family:'Caveat',cursive;font-weight:700;font-size:34px;margin:0;
    color:var(--ink);line-height:1;outline:none;cursor:text;
    border-bottom:1.5px dashed var(--line-muted);padding:0 2px;
  }
  .title-edit:hover, .title-edit:focus{border-bottom-color:var(--chalk-blue);}
  .hint{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.6px;color:var(--ink-dim);text-transform:uppercase;}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--chalk-blue);letter-spacing:0.5px;white-space:nowrap;}
  .pill{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.5px;
    background:transparent;color:var(--ink-dim);border:1.5px dashed var(--line-muted);
    border-radius:14px;padding:6px 13px;cursor:pointer;text-transform:uppercase;
    transition:all .15s ease;white-space:nowrap;
  }
  .pill:hover{color:var(--ink);border-color:var(--chalk-pink);}
  select.pill{-webkit-appearance:none;appearance:none;padding-right:22px;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position:calc(100% - 13px) center, calc(100% - 8px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  select.pill option{background:var(--bg-node);color:var(--ink);}
  .pill.export{border-style:solid;border-color:var(--ctrl-green);color:var(--ctrl-green);}
  .pill.export:hover{background:var(--ctrl-green);color:var(--bg-canvas);}
  .tabbar{display:flex;align-items:center;gap:8px;padding:0 26px 12px;border-bottom:1.5px dashed var(--line-muted);flex-shrink:0;overflow-x:auto;}
  .tab{
    display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-dim);
    background:var(--bg-node);border:1.5px solid var(--line-muted);border-radius:12px;
    padding:5px 10px;cursor:pointer;white-space:nowrap;transition:all .15s ease;flex-shrink:0;
  }
  .tab:hover{color:var(--ink);border-color:var(--chalk-blue);}
  .tab.active{color:var(--bg-canvas);background:var(--chalk-yellow);border-color:var(--chalk-yellow);font-weight:700;}
  .tab .tab-x{opacity:.6;padding-left:2px;}
  .tab .tab-x:hover{opacity:1;color:var(--chalk-pink);}
  .tab-add{
    width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px dashed var(--line-muted);
    background:transparent;color:var(--ink-dim);cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .tab-add:hover{color:var(--bg-canvas);background:var(--chalk-blue);border-color:var(--chalk-blue);}
  .canvas-wrap{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none;}
  .canvas-wrap.panning{cursor:grabbing;}
  .world{position:absolute;left:0;top:0;}
  svg.wires{position:absolute;pointer-events:none;overflow:visible;}
  svg.wires path{fill:none;stroke:var(--line-muted);stroke-width:1.6;stroke-dasharray:1 6;stroke-linecap:round;}

  .node-box{
    position:absolute;display:flex;flex-direction:column;
    min-width:130px;max-width:260px;width:max-content;
    background:var(--bg-node);border:1.5px dashed var(--line-muted);
    border-radius:7px 11px 9px 13px;padding:8px 11px;
    transition:background .15s ease, border-color .15s ease;user-select:none;cursor:grab;touch-action:none;
  }
  .node-box:hover{background:var(--bg-node-hover);border-color:var(--chalk-blue);}
  .node-box.root{border-style:solid;border-width:2px;border-color:var(--chalk-yellow);border-radius:14px;max-width:300px;min-width:180px;}
  .node-box.root .text{font-size:20px;font-weight:700;}
  .node-box.expanded{max-width:none;width:380px;min-height:260px;cursor:default;}
  .node-box.selected{outline:2px solid var(--chalk-blue);outline-offset:3px;}
  .node-box.drop-target{border-color:var(--chalk-pink);box-shadow:0 0 0 3px rgba(233,160,181,0.35);}

  .content-row{display:flex;align-items:flex-start;gap:6px;width:100%;}

  .resize-handle{
    position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;
    color:var(--line-muted);display:flex;align-items:flex-end;justify-content:flex-end;
    font-size:12px;line-height:1;user-select:none;
  }
  .resize-handle:hover{color:var(--chalk-blue);}

  .collapse-btn{
    position:absolute;min-width:20px;height:20px;padding:0 5px;flex-shrink:0;
    border:1.5px solid var(--line-muted);border-radius:10px;background:var(--bg-canvas);color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;transition:all .15s ease;
  }
  .collapse-btn:hover{border-color:var(--chalk-blue);color:var(--chalk-blue);}

  .markers{display:flex;align-items:center;gap:5px;flex-shrink:0;margin-top:2px;}
  .marker{font-family:'Space Mono',monospace;font-size:13px;user-select:none;}
  .marker.bullet{color:var(--ctrl-blue);font-size:16px;line-height:1;}
  .marker.seq{color:var(--ctrl-green);font-weight:700;}
  .checkbox{
    width:16px;height:16px;flex-shrink:0;border-radius:4px;margin-top:2px;
    border:1.6px solid var(--ctrl-yellow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ctrl-yellow);
  }
  .checkbox.checked{background:var(--ctrl-yellow);color:var(--bg-node);}

  .text{
    flex:1;min-width:0;font-size:15.5px;line-height:1.3;
    white-space:normal;overflow-wrap:break-word;word-break:break-word;color:var(--ink);cursor:text;
    outline:1.5px dashed var(--line-muted);outline-offset:2px;border-radius:4px;
  }
  .text[contenteditable="true"]:hover{outline-color:var(--chalk-blue);}
  .text[contenteditable="true"]:focus{outline:1.5px dashed var(--chalk-blue);outline-offset:2px;}
  .node-box.is-checked .text{text-decoration:line-through;opacity:0.5;}

  .notes-dot{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ctrl-blue);}

  .toolbar{display:flex;gap:3px;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line-muted);opacity:.4;transition:opacity .15s ease;width:100%;}
  .node-box:hover .toolbar{opacity:1;}
  .toolbar button{
    width:19px;height:19px;border-radius:50%;border:1px solid var(--line-muted);
    background:var(--bg-canvas);color:var(--ink-dim);font-size:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;transition:all .15s ease;
  }
  .toolbar button:hover{filter:brightness(1.25);}
  .toolbar .markerToggle{border-color:var(--ctrl-blue);color:var(--ctrl-blue);}
  .toolbar .markerToggle.active{background:var(--ctrl-bg-on);border-color:var(--ctrl-blue);color:var(--ctrl-blue-dark);}
  .toolbar .checkToggle{border-color:var(--ctrl-yellow);color:var(--ctrl-yellow);}
  .toolbar .checkToggle.active{background:var(--ctrl-bg-on);border-color:var(--ctrl-yellow);color:var(--ctrl-yellow-dark);}
  .toolbar .notesBtn{border-color:var(--act-purple);color:var(--act-purple);} /* item 4.2 */
  .toolbar .notesBtn:hover{background:var(--act-purple);border-color:var(--act-purple);color:var(--bg-canvas);}
  .toolbar .add{border-color:var(--act-green);color:var(--act-green);} /* item 4.2 */
  .toolbar .add:hover{background:var(--act-green);border-color:var(--act-green);color:var(--bg-canvas);}
  .toolbar .del{border-color:var(--act-red);color:var(--act-red);}
  .toolbar .del:hover{background:var(--act-red);border-color:var(--act-red);color:var(--bg-canvas);}
  .toolbar .del:disabled{border-color:var(--act-red-dark);color:var(--act-red-dark);cursor:not-allowed;opacity:.55;}
  .toolbar .del:disabled:hover{background:transparent;color:var(--act-red-dark);filter:none;}

  .expand-head{display:flex;align-items:flex-start;gap:8px;width:100%;}
  .expand-head .text{font-size:17px;font-weight:700;}
  .icon-btn{
    width:22px;height:22px;flex-shrink:0;border-radius:50%;border:1px solid var(--line-muted);
    background:var(--bg-canvas);color:var(--ink-dim);cursor:pointer;font-size:11px;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .icon-btn:hover{background:var(--chalk-pink);border-color:var(--chalk-pink);color:var(--bg-canvas);}
  .icon-btn.add-variant{border-color:var(--act-green);color:var(--act-green);} /* item 4.2 */
  .icon-btn.add-variant:hover{background:var(--act-green);border-color:var(--act-green);color:var(--bg-canvas);}
  .icon-btn.shrink-variant{border-color:var(--act-purple);color:var(--act-purple);} /* item 4.3: same purple as expand */
  .icon-btn.shrink-variant:hover{background:var(--act-purple);border-color:var(--act-purple);color:var(--bg-canvas);}
  .icon-btn.del-variant{border-color:var(--act-red);color:var(--act-red);} /* item 4.5 */
  .icon-btn.del-variant:hover{background:var(--act-red);border-color:var(--act-red);color:var(--bg-canvas);}
  .icon-btn.del-variant:disabled{border-color:var(--act-red-dark);color:var(--act-red-dark);cursor:not-allowed;opacity:.55;}
  .icon-btn.del-variant:disabled:hover{background:transparent;color:var(--act-red-dark);}
  .icon-btn.checkToggle{border-color:var(--ctrl-yellow);color:var(--ctrl-yellow);}
  .icon-btn.checkToggle.active{background:var(--ctrl-bg-on);border-color:var(--ctrl-yellow);color:var(--ctrl-yellow-dark);}
  .expand-toolbar{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0;}
  .expand-toolbar button{
    font-family:'Space Mono',monospace;font-size:10.5px;background:var(--bg-canvas);color:var(--ink-dim);
    border:1.5px dashed var(--line-muted);border-radius:6px;padding:4px 8px;cursor:pointer;transition:all .15s ease;
  }
  .expand-toolbar button:hover{color:var(--ink);border-color:var(--chalk-blue);}
  .notes-editor{
    flex:1;min-height:150px;overflow:auto;font-size:15px;line-height:1.5;
    color:var(--ink);border-top:1px dashed var(--line-muted);padding-top:9px;cursor:text;
    outline:1.5px dashed var(--line-muted);outline-offset:4px;border-radius:4px;touch-action:pan-y;
  }
  .notes-editor:hover{outline-color:var(--chalk-blue);}
  .notes-editor:focus{outline:1.5px dashed var(--chalk-blue);outline-offset:4px;}
  .notes-editor h3{font-family:'Caveat',cursive;font-size:24px;color:var(--chalk-yellow);margin:0.4em 0 0.2em;}
  .notes-editor ul{padding-left:1.2em;}
  .notes-editor ol{padding-left:1.2em;}
  .notes-editor li{margin:2px 0;}
  .notes-editor:empty:before{content:'Write freely here…';color:var(--ink-dim);}
  .note-check{display:flex;align-items:flex-start;gap:7px;margin:3px 0;}
  .note-check-toggle{
    flex-shrink:0;width:15px;height:15px;margin-top:2px;border-radius:4px;cursor:pointer;
    border:1.6px solid var(--ctrl-yellow);color:var(--ctrl-yellow);
    display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;user-select:none;
  }
  .note-check.checked .note-check-toggle{background:var(--ctrl-yellow);color:var(--bg-node);}
  .note-check-label{flex:1;min-width:0;}
  .note-check.checked .note-check-label{text-decoration:line-through;opacity:.55;}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:24px;color:var(--ink-dim);}
  ::-webkit-scrollbar{width:12px;height:12px;}
  ::-webkit-scrollbar-track{background:var(--bg-canvas);}
  ::-webkit-scrollbar-thumb{background:var(--line-muted);border-radius:6px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">◍</span>
      <div class="title-edit" id="titleEdit" contenteditable="true" spellcheck="false">Name</div>
      <span class="hint">notepad · mind map · to‑do (standalone)</span>
    </div>
    <div class="actions">
      <span class="status" id="status">Last Saved —</span>
      <select class="pill" id="themeSelect" title="Color theme"></select>
      <select class="pill" id="fontSelect" title="Font"></select>
      <button class="pill" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
      <button class="pill" id="redoBtn" title="Redo (Ctrl+Y)">Redo</button>
      <button class="pill" id="centerBtn">Center</button>
      <button class="pill" id="expandAllBtn">Expand all</button>
      <button class="pill" id="collapseAllBtn">Collapse all</button>

  function setAllCollapsed(node,val){ if(node.children.length) node.collapsed=val; for(const c of node.children) setAllCollapsed(c,val); }
  document.getElementById('titleEdit').addEventListener('blur', function(){
    const t=document.getElementById('titleEdit'); setTitle(t.textContent.trim()||'Untitled'); t.textContent=title;
    tree().text = title; updateDocTitle(); render(); scheduleSave();
  });
  document.getElementById('titleEdit').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('titleEdit').blur(); } });
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  function setupShortcuts(){
    document.addEventListener('keydown', function(e){
      const meta = e.ctrlKey || e.metaKey;
      if(!meta) return;
      const active = document.activeElement;
      const isEditing = active && (active.isContentEditable || active.tagName==='INPUT' || active.tagName==='TEXTAREA');
      if(isEditing) return;
      const key = e.key.toLowerCase();
      if(key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
      else if(key==='y' || (key==='z' && e.shiftKey)){ e.preventDefault(); redo(); }
    });
  }
  document.getElementById('centerBtn').addEventListener('click', centerView);
  document.getElementById('expandAllBtn').addEventListener('click', function(){ setAllCollapsed(tree(),false); commitLayout(); scheduleSave(); });
  document.getElementById('collapseAllBtn').addEventListener('click', function(){ for(const c of tree().children) setAllCollapsed(c,true); commitLayout(); scheduleSave(); });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('Clear this map and start with a blank map?')){ setMainTree(blankNode(title)); commitLayout(); scheduleSave(); centerView(); }
  });
  function exportHtml(){ // item 4.2: download a standalone, fully functional copy of the current map
    const dataScript = '\n<script>window.__EXPORTED_TREE__ = ' + JSON.stringify(mainTree, (k,v)=>k.startsWith('_')?undefined:v) + ';\nwindow.__EXPORTED_TITLE__ = ' + JSON.stringify(title) + ';<\/script>\n';
    const html = '<!DOCTYPE html>\n' + ORIGINAL_HTML.replace('<head>', '<head>'+dataScript);
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=(title||'mindmap').replace(/[^a-z0-9\-_]+/gi,'_')+'.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
  document.getElementById('exportBtn').addEventListener('click', exportHtml);
  function applyTheme(id){ document.documentElement.setAttribute('data-theme', id); try{ localStorage.setItem(THEME_KEY, id); }catch(e){} }
  function applyFont(id){
    const f=FONTS.find(f=>f[0]===id) || FONTS[0];
    document.documentElement.style.setProperty('--body-font', f[1]);
    try{ localStorage.setItem(FONT_KEY, id); }catch(e){}
  }
  function setupThemeFontSelectors(){ // item 5: theme + font dropdowns, top right
    const themeSel=document.getElementById('themeSelect');
    THEMES.forEach(t=>{ const o=document.createElement('option'); o.value=t[0]; o.textContent=t[1]; themeSel.appendChild(o); });
    let savedTheme='chalkboard'; try{ savedTheme=localStorage.getItem(THEME_KEY)||'chalkboard'; }catch(e){}
    if(!THEMES.some(t=>t[0]===savedTheme)) savedTheme='chalkboard';
    themeSel.value=savedTheme; applyTheme(savedTheme);
    themeSel.addEventListener('change', ()=>applyTheme(themeSel.value));
    const fontSel=document.getElementById('fontSelect');
    FONTS.forEach(f=>{ const o=document.createElement('option'); o.value=f[0]; o.textContent=f[2]; fontSel.appendChild(o); });
    let savedFont='patrick'; try{ savedFont=localStorage.getItem(FONT_KEY)||'patrick'; }catch(e){}
    if(!FONTS.some(f=>f[0]===savedFont)) savedFont='patrick';
    fontSel.value=savedFont; applyFont(savedFont);
    fontSel.addEventListener('change', ()=>applyFont(fontSel.value));
  }
  setupThemeFontSelectors();
  loadSaved();
  document.getElementById('titleEdit').textContent = title;
  updateDocTitle();
  renderTabs();
  setupTabbar();
  setupPan();
  setupZoom();
  setupShortcuts();
  commitLayout();
  centerView();
  pushHistory();
  saveData();
  if(document.fonts && document.fonts.ready){ // safety net: web fonts load asynchronously, so a box measured before its font finishes loading can silently resize once the browser swaps fonts — with nothing to re-run overlap resolution or redraw wires afterward. Once fonts are confirmed loaded, force one more full layout pass so any such drift gets corrected.
    document.fonts.ready.then(()=>{ commitLayout(); });
  }
})();
</script>
<script>
  // PWA: register service worker for offline support + installability.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline support unavailable; app still works online */ });
    });
  }
</script>
